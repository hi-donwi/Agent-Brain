name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Go backports security fixes only to the two most recent major releases,
        # so the matrix tracks those.
        go: ['1.26', '1.27']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true

      # `make check` is the local mirror of this job: gofmt, go.mod tidiness, vet,
      # race-enabled tests, and a smoke run of the built binary.
      - name: make check
        run: make check

  cross-compile:
    name: Cross-compile static binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: true

      # lokal ships as a zero-dependency static binary (ADR-0001); a CGO
      # regression would otherwise only surface on a user's machine.
      - name: Build every release platform and confirm static linking
        run: make static-check

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: true
      - name: govulncheck
        run: make vulncheck

  # Secret and dependency gate via the pinned Agent-Secure engine, the same pin
  # the sibling Go repositories use.
  agent-secure:
    uses: hi-donwi/Agent-Secure/.github/workflows/agent-secure-gate.yml@1dffc4ca7e00bb4e9aa108603fcf02cfeb1637a8
    with:
      root: .
      engine_version: v0.1.5
      engine_sha256: 491c0f4b9b4fe379b13f85be0a8956343a6731694e714763d33b3827e65649c9
      gitleaks_version: 8.30.1
      gitleaks_sha256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      osv_scanner_version: 2.5.1
      osv_scanner_sha256: f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be

  # One stable check name to require, whatever the matrix above grows into.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [test, cross-compile, vulncheck, agent-secure]
    if: always()
    steps:
      - name: Require all checks to pass
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
          ANY_FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "Dependent job results: ${RESULTS}"
          if [ "${ANY_FAILED}" = "true" ]; then
            exit 1
          fi
